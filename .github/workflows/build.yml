name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'   # نسخه دقیق
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # حذف کامل پوشه windows و بازسازی آن برای جلوگیری از مشکل VS2019
      - name: Regenerate Windows project
        shell: pwsh
        run: |
          Remove-Item -Path "windows" -Recurse -Force -ErrorAction SilentlyContinue
          flutter create --platforms=windows .

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # اگر از Isar یا build_runner استفاده می‌کنید این مرحله را نگه دارید
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'   # یا نسخه‌ی دقیق دیگر
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # حذف متغیرهای محیطی مربوط به نسخه‌های قدیمی Visual Studio
      - name: Remove old Visual Studio environment variables
        shell: pwsh
        run: |
          Remove-Item Env:VS160COMNTOOLS -ErrorAction SilentlyContinue
          Remove-Item Env:VS150COMNTOOLS -ErrorAction SilentlyContinue
          Remove-Item Env:VS140COMNTOOLS -ErrorAction SilentlyContinue
          Remove-Item Env:VSINSTALLDIR -ErrorAction SilentlyContinue
          # برای اطمینان، متغیر CMake generator را صریحاً تنظیم کنید
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"

      # بازسازی پوشه‌ی ویندوز برای حذف هرگونه فایل قدیمی
      - name: Regenerate Windows project
        shell: pwsh
        run: |
          Remove-Item -Path "windows" -Recurse -Force -ErrorAction SilentlyContinue
          flutter create --platforms=windows .

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # اگر از Isar یا build_runner استفاده می‌کنید این مرحله را نگه دارید
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

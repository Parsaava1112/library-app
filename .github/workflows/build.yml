name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # اجرای دستی از تب Actions

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # 🔴 نسخه Flutter خود را دقیقاً وارد کنید
          channel: 'stable'
          cache: true

      - name: Clean Flutter
        run: flutter clean

      # حذف فایل‌های کش CMake که ممکن است از سیستم محلی باقی مانده باشند
      - name: Remove CMake cache files
        shell: pwsh
        run: |
          Remove-Item -Path "windows/CMakeCache.txt" -ErrorAction SilentlyContinue
          Remove-Item -Path "windows/CMakeSettings.json" -ErrorAction SilentlyContinue
          Remove-Item -Path "build/windows" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Get dependencies
        run: flutter pub get

      # اگر از Isar یا build_runner استفاده می‌کنید این مرحله الزامی است
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            build/windows/x64/runner/Release/
          if-no-files-found: error

name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'   # یا '3.27.4' یا هر نسخه دلخواه
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # حذف هرگونه فایل CMake قدیمی که ممکن است در مخزن باشد
      - name: Remove old CMake files
        shell: pwsh
        run: |
          if (Test-Path "windows/CMakeSettings.json") { Remove-Item "windows/CMakeSettings.json" -Force }
          if (Test-Path "windows/CMakeCache.txt") { Remove-Item "windows/CMakeCache.txt" -Force }
          if (Test-Path "build/windows") { Remove-Item "build/windows" -Recurse -Force }

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # اگر از Isar یا build_runner استفاده می‌کنید این مرحله را نگه دارید
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
